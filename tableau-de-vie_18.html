<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de Bord de Vie</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js" async></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1419;--card:#1A2332;--border:#2A3544;--text:#E8EDF2;--muted:#6B7F94;--accent:#00D4AA;--accent2:#FFB020;--danger:#FF6B6B;--violet:#A78BFA;--sky:#38BDF8;--orange:#FB923C;--emerald:#34D399}
body.light{--bg:#F4F6F9;--card:#FFFFFF;--border:#D8DEE7;--text:#1A2332;--muted:#6B7F94;--accent:#00A88A;--accent2:#D98800;--danger:#E0524F;--violet:#7C5CD6;--sky:#1F8FD0;--orange:#E07B2E;--emerald:#1FA871}
body.light .blobs{opacity:.35}
*{margin:0;padding:0;box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blobs::before,.blobs::after{content:'';position:absolute;border-radius:50%;filter:blur(120px);opacity:.06;animation:bl 25s ease-in-out infinite}
.blobs::before{width:500px;height:500px;background:var(--accent);top:-200px;right:-100px}
.blobs::after{width:400px;height:400px;background:var(--accent2);bottom:-200px;left:-100px;animation-delay:-12s;animation-direction:reverse}
@keyframes bl{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-30px)}}
@keyframes ckPop{0%{transform:scale(1)}40%{transform:scale(1.35)}70%{transform:scale(.92)}100%{transform:scale(1)}}
@keyframes rowIn{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes cardIn{0%{opacity:0;transform:translateY(8px) scale(.985)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes btnPress{0%{transform:scale(1)}50%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes flashOk{0%{background:rgba(0,212,170,.28)}100%{background:transparent}}
@keyframes gaugePulse{0%{transform:scale(1)}45%{transform:scale(1.08)}100%{transform:scale(1)}}
.ckJustOn{animation:ckPop .32s ease}
.rowIn{animation:rowIn .28s ease both}
.cardIn{animation:cardIn .32s ease both}
.pressed{animation:btnPress .25s ease}
.flashOk{animation:flashOk .7s ease}
.gaugePulse{animation:gaugePulse .4s ease}
@media (prefers-reduced-motion:reduce){.ck.on,.rowIn,.cardIn,.pressed,.flashOk,.gaugePulse{animation:none}}
#sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--card);border-right:1px solid var(--border);z-index:50;display:flex;flex-direction:column;transition:transform .3s}
#sidebar .logo{padding:16px 14px 12px;border-bottom:1px solid var(--border)}
#sidebar nav{flex:1;overflow-y:auto;padding:6px}
#sidebar nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;color:var(--muted);font-size:.78rem;font-weight:500;cursor:pointer;margin-bottom:1px;transition:all .2s;text-decoration:none}
#sidebar nav a:hover{color:var(--text);background:rgba(255,255,255,.04)}
#sidebar nav a.active{color:var(--accent);background:rgba(0,212,170,.1);font-weight:600}
#sidebar nav a i{width:16px;text-align:center;font-size:.82rem}
.sv{padding:10px 14px;border-top:1px solid var(--border);font-size:.68rem;color:var(--muted);display:flex;align-items:center;gap:6px}
#main{margin-left:240px;min-height:100vh;position:relative;z-index:1}
#topBar{position:sticky;top:0;z-index:40;background:rgba(15,20,25,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:7px 14px;display:flex;align-items:center;gap:8px}
#mt{display:none;background:none;border:none;color:var(--text);font-size:1.1rem;cursor:pointer}
.wc{display:flex;align-items:center;gap:4px;flex:1;justify-content:center}
.wc button{background:var(--card);border:1px solid var(--border);color:var(--text);width:26px;height:26px;border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.65rem;transition:all .2s}
.wc button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.wc button:disabled{opacity:.25;cursor:default}
.wc .todayBtn{width:auto;padding:0 8px;font-size:.6rem;font-weight:600}
.wc .weekSel{background:var(--card);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:.62rem;font-weight:600;padding:4px 6px;border-radius:5px;cursor:pointer;max-width:170px;margin-left:4px;transition:border-color .2s}
.wc .weekSel:hover,.wc .weekSel:focus{border-color:var(--accent);outline:none}
.wc .weekSel option{background:var(--card);color:var(--text)}
.wc .weekSel optgroup{background:var(--bg);color:var(--accent);font-weight:700}
.wc .weekSel option:disabled{color:var(--muted);font-weight:600}
.dc{display:flex;flex-direction:column;align-items:center;padding:2px 7px;border-radius:6px;min-width:38px}
.dc .dn{font-size:.55rem;color:var(--muted);font-weight:600}
.dc .dd{font-size:.82rem;font-weight:700}
.dc.td{background:rgba(0,212,170,.14)}.dc.td .dd,.dc.td .dn{color:var(--accent)}
.tb{display:flex;gap:4px}
.tb button{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:4px 8px;border-radius:5px;cursor:pointer;font-size:.68rem;font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:3px}
.tb button:hover{color:var(--text);border-color:var(--accent)}
#content{padding:16px 16px 50px}
.cd{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:14px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sh .ic{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
.pr{position:relative;width:46px;height:46px;flex-shrink:0}
.pr svg{transform:rotate(-90deg)}
.pr .pv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700}
.tg{width:100%;border-collapse:separate;border-spacing:0}
.tg th{padding:4px 2px;font-size:.56rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.2px;text-align:center;border-bottom:1px solid var(--border)}
.tg th:first-child{text-align:left;padding-left:2px;min-width:90px}
.tg td{padding:3px 2px;text-align:center;border-bottom:1px solid rgba(42,53,68,.3)}
.tg td:first-child{text-align:left;padding-left:2px;font-size:.68rem;font-weight:500}
.wf{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(42,53,68,.25)}
.wf label{flex:1;font-size:.8rem;font-weight:500}
.wf input,.wf select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px 8px;border-radius:5px;font-family:inherit;font-size:.8rem;transition:border-color .2s}
.wf input:focus,.wf select:focus{outline:none;border-color:var(--accent)}
.wf input[type="number"]{width:70px;text-align:center}
.ck{width:18px;height:18px;border-radius:4px;border:2px solid var(--border);background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .1s;flex-shrink:0;color:transparent;font-size:.5rem}
.ck:hover{border-color:var(--accent)}.ck:active{transform:scale(.88)}.ck.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.og{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-bottom:16px}
.oc{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:all .2s}
.oc:hover{border-color:rgba(255,255,255,.1);transform:translateY(-1px)}
.oc .oi{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0}
.oc .on{flex:1;min-width:0}.oc .on h4{font-size:.72rem;font-weight:600;margin-bottom:1px}.oc .on p{font-size:.62rem;color:var(--muted)}
.pb{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin-top:3px}.pf{height:100%;border-radius:3px;transition:width .4s}
.bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:6px;margin-bottom:12px}
.bgH{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;margin-bottom:12px}
.bgH .bi{padding:5px 3px;min-width:0;overflow:hidden;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.bgH .bi .bvRow{display:flex;align-items:center;justify-content:center;gap:1px;height:20px;flex-shrink:0}
.bgH .bi .bl{font-size:.52rem;line-height:1.1;white-space:normal;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;flex:1;display:flex;align-items:center}
.bgH .bi .br{font-size:.46rem;height:11px;flex-shrink:0;line-height:1}
.bgH .bi .hbInput{width:100%!important;max-width:44px;font-size:.8rem!important;font-weight:700}
.bgH .bi .hbUnit{font-size:.54rem}
.ovTop{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lexChip{background:none;border:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:.62rem;font-weight:600;padding:3px 9px;border-radius:20px;cursor:pointer;transition:all .15s}
.lexChip:hover{filter:brightness(1.2)}
.bilChip{background:none;border:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:.66rem;font-weight:600;padding:5px 12px;border-radius:8px;cursor:pointer;transition:all .15s}
.bilChip.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.bilChip:hover{filter:brightness(1.15)}
.bilTab{background:none;border:none;color:var(--muted);font-family:inherit;font-size:.7rem;font-weight:600;padding:5px 14px;border-radius:6px;cursor:pointer;transition:all .15s}
.bilTab.on{background:var(--accent);color:var(--bg)}
.dosViewTab{background:none;border:none;color:var(--muted);font-family:inherit;font-size:.72rem;padding:4px 10px;border-radius:5px;cursor:pointer;transition:all .15s}
.dayPick{background:none;border:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:.56rem;font-weight:600;padding:2px 5px;border-radius:5px;cursor:pointer;transition:all .12s}
.wDot{width:20px;height:20px;border-radius:50%;border:1px solid var(--border);background:var(--bg);cursor:pointer;padding:0;transition:all .12s}
.wDot.on{background:var(--accent2);border-color:var(--accent2)}
.wDot:active{transform:scale(.85)}
.dayPick.on{background:var(--accent2);border-color:var(--accent2);color:var(--bg)}
.dayPick:active{transform:scale(.9)}
.dosViewTab.on{background:var(--accent);color:var(--bg)}
.dosViewTab:active{transform:scale(.9)}
.dosCards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.dosCard{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 12px;animation:cardIn .3s ease both}
.dosCard.dos-term{opacity:.65}
.dosCardGrid{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.dosCardGrid label{font-size:.6rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.dosCardGrid>div{min-width:0}
.dosCardGrid .inp{font-size:.74rem}
@media(max-width:560px){.ovTop{grid-template-columns:1fr}}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calDow{text-align:center;font-size:.62rem;font-weight:700;color:var(--muted);padding:5px 0;text-transform:uppercase;letter-spacing:.4px}
.calCell{background:var(--card);border:1px solid var(--border);border-radius:8px;min-height:80px;padding:4px;cursor:pointer;transition:all .15s;overflow:hidden}
.calCell:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.2)}
.calEmpty{background:transparent;border:none;cursor:default}
.calEmpty:hover{transform:none;box-shadow:none}
.calCell.calToday{border-color:#60A5FA;background:rgba(96,165,250,.1);box-shadow:inset 0 0 0 1px #60A5FA}
.calNum{font-size:.7rem;font-weight:600;margin-bottom:3px;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.calCell.calToday .calNum{color:#fff;font-weight:800;background:#60A5FA;border-radius:50%}
.calEv{font-size:.52rem;line-height:1.25;border-radius:4px;padding:2px 4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.calTab{background:none;border:none;color:var(--muted);font-family:inherit;font-size:.74rem;font-weight:600;padding:5px 16px;border-radius:6px;cursor:pointer;transition:all .15s}
.calTab.on{background:var(--accent);color:var(--bg)}
.calWeek{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.calWcol{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;min-height:200px}
.calWcol:hover{border-color:var(--accent)}
.calWcol.calToday{border-color:#60A5FA;box-shadow:0 0 0 1px #60A5FA}
.calWhead{text-align:center;padding:8px 4px;border-bottom:1px solid var(--border);background:var(--bg)}
.calWcol.calToday .calWhead{background:rgba(96,165,250,.12)}
.calWdow{display:block;font-size:.58rem;font-weight:700;color:var(--muted);text-transform:uppercase}
.calWnum{display:block;font-size:1.1rem;font-weight:800;margin-top:2px}
.calWcol.calToday .calWnum{color:#60A5FA}
.calWbody{flex:1;padding:5px;display:flex;flex-direction:column;gap:4px}
.calWev{background:var(--bg);border-radius:6px;padding:4px 6px;font-size:.6rem;cursor:pointer;transition:all .15s;display:flex;align-items:flex-start;gap:5px}
.calWev:hover{filter:brightness(1.3)}
.calWchk{flex-shrink:0;width:14px;height:14px;border-radius:4px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.4rem;color:transparent;cursor:pointer;margin-top:1px}
.calWchk.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.calWmain{flex:1;min-width:0;cursor:pointer}
.calWtime{display:block;font-weight:700;font-size:.56rem;color:var(--muted)}
.calWttl{display:block;line-height:1.2}
.calWempty{color:var(--border);text-align:center;font-size:1.1rem;margin-top:8px;font-weight:300}
@media(max-width:700px){.calWeek{grid-template-columns:repeat(3,1fr)}.calWcol{min-height:120px}}
@media(max-width:600px){.calCell{min-height:56px}.calEv{font-size:.46rem}}
.bi{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:7px;text-align:center}
.bi .bv{font-size:1rem;font-weight:700}.bi .bl{font-size:.56rem;color:var(--muted);text-transform:uppercase;margin-top:1px}.bi .br{font-size:.5rem;color:var(--muted);margin-top:1px}
.bi.dng{border-color:rgba(255,107,107,.4)}.bi.dng .bv{color:var(--danger)}
.bi.wrn{border-color:rgba(255,176,32,.4)}.bi.wrn .bv{color:var(--accent2)}
.bi.gud .bv{color:var(--accent)}
.ab{background:rgba(0,212,170,.08);border:1px dashed var(--accent);color:var(--accent);padding:4px 10px;border-radius:5px;cursor:pointer;font-family:inherit;font-size:.72rem;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:3px}
.ab:active{transform:scale(.92)}
.ab:hover{background:rgba(0,212,170,.18)}
.na textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px;border-radius:7px;font-family:inherit;font-size:.78rem;min-height:50px;resize:vertical}
.na textarea:focus{outline:none;border-color:var(--accent)}
.db{background:none;border:none;color:var(--danger);cursor:pointer;font-size:.7rem;opacity:.5}.db:hover{opacity:1}
.ph{color:var(--danger)!important;font-weight:700}.pm{color:var(--accent2)!important;font-weight:700}.pb2{color:var(--accent)!important;font-weight:700}
.dt{font-size:.66rem;color:var(--muted)}.dt td{font-size:.66rem!important;font-weight:600!important;padding:4px 3px!important}
.shr{background:rgba(255,255,255,.02)}
.dos-term,.dos-term input,.dos-term select{text-decoration:line-through;opacity:.35}
.dg{display:flex;gap:3px;margin-bottom:10px;flex-wrap:wrap}.dg>div{text-align:center;flex:1;min-width:40px}.dg>div>div:first-child{font-size:.5rem;color:var(--muted);margin-bottom:1px}
.gi{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid rgba(42,53,68,.2)}
.gi input[type="text"]{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 7px;border-radius:5px;font-family:inherit;font-size:.78rem}
.gi input[type="text"]:focus{outline:none;border-color:var(--accent)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--accent);color:var(--bg);padding:7px 14px;border-radius:7px;font-size:.78rem;font-weight:600;transform:translateY(60px);opacity:0;transition:all .3s;z-index:999;pointer-events:none}
#undoBar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);border:1px solid var(--border);box-shadow:0 6px 24px rgba(0,0,0,.35);color:var(--text);padding:10px 14px;border-radius:10px;font-size:.78rem;display:flex;align-items:center;gap:14px;z-index:1000;opacity:0;transition:all .3s;pointer-events:none;max-width:92vw}
#storageBar{position:fixed;top:0;left:0;right:0;background:var(--danger);color:#fff;padding:12px 16px;z-index:10000;box-shadow:0 4px 18px rgba(0,0,0,.4);transform:translateY(-120%);transition:transform .35s;max-width:640px;margin:0 auto;border-radius:0 0 12px 12px}
#storageBar.show{transform:translateY(0)}
#undoBar.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
#undoBtn{background:var(--accent);color:var(--bg);border:none;font-family:inherit;font-size:.74rem;font-weight:700;padding:6px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
#undoBtn:hover{filter:brightness(1.1)}
.toast.show{transform:translateY(0);opacity:1}
.inp{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:3px 5px;border-radius:4px;font-family:inherit;font-size:.68rem;width:100%}.inp:focus{outline:none;border-color:var(--accent)}
.actPrevBox{cursor:pointer;display:flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 7px;font-size:.68rem;transition:border-color .2s}
.actPrevBox:hover{border-color:var(--accent)}
.actChev{font-size:.55rem;color:var(--muted);margin-left:auto;transition:transform .2s}
.actPrevBox.open .actChev{transform:rotate(180deg)}
.actPrev{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:150px}
.actCnt{background:var(--border);color:var(--text);border-radius:9px;padding:0 6px;font-size:.58rem;font-weight:700;flex-shrink:0}
.actPop{display:none;position:fixed;z-index:200;width:250px;max-height:300px;overflow-y:auto;background:var(--card);border:1px solid var(--accent);border-radius:8px;padding:9px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.actPop.show{display:block}
.actPopHd{font-size:.6rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px}
.wkBox{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:9px;background:var(--bg);cursor:pointer;transition:all .2s}
.wkBox:hover{border-color:var(--accent)}
.wkBox.on{border-color:var(--accent);background:rgba(0,212,170,.08)}
@media(max-width:900px){#sidebar{transform:translateX(-100%)}#sidebar.open{transform:translateX(0)}#main{margin-left:0}#mt{display:block}#content{padding:10px 6px 50px}.og{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}.tg th,.tg td{padding:2px 1px;font-size:.5rem}.dc{padding:2px 3px;min-width:30px}.dc .dn{font-size:.45rem}.dc .dd{font-size:.68rem}.bg{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}.bgH{grid-template-columns:repeat(4,1fr)}.wc .todayBtn{display:none}}
</style>
</head>
<body>

function objScore(s){var os=gOF(s);if(!os.length)return null;var w=wf(s);if(!w.obj)return 0;var t=0,d=0;os.forEach(function(o){var a=w.obj[o.id]||[];for(var i=0;i<6;i++){if(daySkipped(s,i))continue;t++;if(a[i])d++}});return t>0?Math.round(d/t*100):null}

function budgetScore(weekObj){
if(weekObj!==undefined)return null; /* pas d'historique par semaine pour le budget mensuel */
var mon=gp('budgetMonthly',{});var cmk=curMonthKey();var cur=mon[cmk]||{revenus:'',depenses:''};
var hasInput=(cur.revenus!==''&&cur.revenus!=null)||(cur.depenses!==''&&cur.depenses!=null);
if(!hasInput){return Number(gp('budgetLastScore',0))||0} /* pas de saisie ce mois : dernier score connu */
var rev=Number(cur.revenus)||0,dep=Number(cur.depenses)||0;var epargne=rev-dep;
/* Composante A : taux d'epargne du mois (proportionnel) */
var A;
if(rev>0){var rate=epargne/rev; /* -inf .. 1 */
  if(rate>=0.2)A=100; else if(rate>=0)A=60+(rate/0.2)*40; /* 0% ->60, 20% ->100 */
  else A=Math.max(0,60+(rate/0.5)*60); /* -50% ou pire -> 0 */

sp('budgetLastScore',score);

/* Extrait les donnees depuis un contenu de fichier : JSON direct, enveloppe {data}, ou HTML de sauvegarde (base64 injecte) */
function parseBackupContent(txt){
/* 1) Tentative JSON direct */
try{var j=JSON.parse(txt);if(j&&j.data&&typeof j.data==='object')return j.data;/* enveloppe */
  if(j&&typeof j==='object'&&(j._p||Object.keys(j).some(function(k){return /^\d{4}-\d{2}-\d{2}$/.test(k)})))return j;/* S.data brut */
}catch(e){}
/* 2) HTML de sauvegarde : on cherche le base64 injecte -> localStorage.setItem("ldv7",...) */
var m=txt.match(/atob\("([A-Za-z0-9+/=]+)"\)/);
if(m&&m[1]){try{var decoded=decodeURIComponent(escape(atob(m[1])));var d=JSON.parse(decoded);if(d&&typeof d==='object')return d}catch(e2){}}
return null;
}

};
reader.onerror=function(){tst('Impossible de lire le fichier')};
reader.readAsText(file);
}

if(IM[f]){if(f==='iRappel'&&e.type!=='change')return;var ms=gp('interp',[]);var i=Number(el.dataset.i),m=ms[i];if(m){m[IM[f]]=f==='iRv'?(el.value===''?'':Number(el.value)):el.value;sp('interp',ms);ss();if(f==='iSt')render();else if(f==='iRappel'){/* pas de re-render complet : on met a jour l'etat de rappel sans recreer le champ (evite le saut du curseur sur iOS) */updateRappelState(el,i)}}return}

if(e.target.closest('[data-act="tpAdd"]')){var pr=gp('travailProjects',[]);pr.push({nom:'',debut:'',fin:'',statut:'a_faire',lastTouch:dKeyToday()});sp('travailProjects',pr);ss();render();return}
var tpD=e.target.closest('[data-act="tpDel"]');if(tpD){var pr=gp('travailProjects',[]);var i=Number(tpD.dataset.i);if(pr[i]){var removed=pr[i];pr.splice(i,1);sp('travailProjects',pr);ss();render();showUndo('Projet supprimé',function(){var p2=gp('travailProjects',[]);p2.splice(i,0,removed);sp('travailProjects',p2)})}return}
if(e.target.closest('[data-act="backupNow"]')){downloadHTML();return}
if(e.target.closest('[data-act="backupDismiss"]')){S.backupDismissed=1;render();return}
if(e.target.closest('[data-act="rapport"]')){askRapportScope();return}
if(e.target.closest('#aDos')){var ds=curDossiers();ds.push({reference:'',name:'',type:'',societe:'',responsable:'',description:'',actionsFaites:[],prochaineAction:[],echeance:'',statut:'en_cours',prio:'moyenne',lastTouch:dKeyToday()});markAnim('row','[data-f="dRef"][data-i="'+(ds.length-1)+'"]');ss();render();return}
var aAdd=e.target.closest('[data-act="actAdd"]');if(aAdd){var ds=curDossiers();var i=Number(aAdd.dataset.i),rawF=aAdd.dataset.fld,fld=AFLD[rawF],d=ds[i];if(d){if(!Array.isArray(d[fld]))d[fld]=actArr(d[fld]);d[fld].push('');openActPop='pop_'+rawF+'_'+i;ss();render()}return}
var aDel=e.target.closest('[data-act="actDel"]');if(aDel){var ds=curDossiers();var i=Number(aDel.dataset.i),j=Number(aDel.dataset.j),rawF=aDel.dataset.fld,fld=AFLD[rawF],d=ds[i];if(d){if(!Array.isArray(d[fld]))d[fld]=actArr(d[fld]);d[fld].splice(j,1);openActPop='pop_'+rawF+'_'+i;ss();render()}return}
if(e.target.closest('#aIn')){var ms=gp('interp',[]);ms.push({reunion:'',employeur:'',nbJours:'',dates:'',lieu:'',revenu:'',statut:'en_attente'});sp('interp',ms);ss();render();return}
if(e.target.closest('[data-act="dd"]')){var i=Number(e.target.closest('[data-act="dd"]').dataset.i);var qk=curQuarterKey();var ds=curDossiers();if(ds&&ds[i]){var removed=ds[i];ds.splice(i,1);ss();render();showUndo('Dossier supprimé',function(){var dd2=dossiersFor(qk);dd2.splice(i,0,removed)})}return}
if(e.target.closest('#aEtT')){var w=wf('etudes');if(!w.tasks)w.tasks=[];w.tasks.push({cours:'',action:'',echeance:'',statut:'a_faire',prio:'moyenne'});ss();render();return}
if(e.target.closest('[data-act="etTDel"]')){var i=Number(e.target.closest('[data-act="etTDel"]').dataset.i);var w=wf('etudes');if(w.tasks&&w.tasks[i]){var removed=w.tasks[i];w.tasks.splice(i,1);ss();render();showUndo('Tâche supprimée',function(){var ww=wf('etudes');if(!ww.tasks)ww.tasks=[];ww.tasks.splice(i,0,removed)})}return}
if(e.target.closest('[data-act="di"]')){var i=Number(e.target.closest('[data-act="di"]').dataset.i);var ms=gp('interp',[]);if(ms[i]){var removed=ms[i];ms.splice(i,1);sp('interp',ms);ss();render();showUndo('Mission supprimée',function(){var m2=gp('interp',[]);m2.splice(i,0,removed);sp('interp',m2)})}return}
var buA=e.target.closest('[data-act="buAdd"]');if(buA){var ms=gp('budget',{});var k=sK(S.wsat);if(!ms[k])ms[k]={items:[]};if(!ms[k].items)ms[k].items=[];ms[k].items.push({intitule:'',actif:'',passif:''});sp('budget',ms);ss();render();return}
var buD=e.target.closest('[data-act="buDel"]');if(buD){var ms=gp('budget',{});var k=sK(S.wsat);var i=Number(buD.dataset.i);if(ms[k]&&ms[k].items&&ms[k].items[i]){var removed=ms[k].items[i];ms[k].items.splice(i,1);sp('budget',ms);ss();render();showUndo('Ligne supprimée',function(){var m2=gp('budget',{});if(!m2[k])m2[k]={items:[]};if(!m2[k].items)m2[k].items=[];m2[k].items.splice(i,0,removed);sp('budget',m2)})}return}
var pwA=e.target.closest('[data-act="pwAdd"]');if(pwA){var pkey=pwA.dataset.pkey,weeks=gp(pkey,[]);weeks.push({titre:'',statut:'a_faire'});sp(pkey,weeks);ss();render();return}
var pwD=e.target.closest('[data-act="pwDel"]');if(pwD){var pkey=pwD.dataset.pkey,weeks=gp(pkey,[]);var i=Number(pwD.dataset.i);if(weeks[i]){var removed=weeks[i];weeks.splice(i,1);sp(pkey,weeks);ss();render();showUndo('Ligne supprimée',function(){var w2=gp(pkey,[]);w2.splice(i,0,removed);sp(pkey,w2)})}return}
}

function applyTheme(){var t=gp('theme','dark');document.body.classList.toggle('light',t==='light');var btn=document.getElementById('btnTheme');if(btn)btn.innerHTML='<i class="fa-solid fa-'+(t==='light'?'sun':'moon')+'"></i>'}
function init(){try{var saved=ld();if(saved)S.data=saved;else S.data={};S.wsat=gSat(new Date());migrateDossiers();bNav();setupEvts();applyTheme();render();if(!saved)ss();setTimeout(maybeShowBackupModal,800)}catch(e){try{document.getElementById('content').innerHTML='<div style="padding:20px;color:#E8EDF2"><h2>Erreur de chargement</h2><p style="color:#FF6B6B;font-size:.8rem">'+(e&&e.message?e.message:e)+'</p></div>'}catch(e2){}}}
/* Declenche init de maniere fiable, meme si DOMContentLoaded est deja passe (cas iOS/Fichiers) */
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init)}else{init()}
</script>
